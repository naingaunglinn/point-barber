# CI for point-barber (design D15 · ADR-001 action item 4 · system-design §4.1).
# PR-A brought the jobs static, unit and pr-title; PR-B adds db; PR-C adds integration; PR-E adds
# images and e2e (stack and health — PR-I adds the Playwright tests and the secret check).
# The PostgreSQL service and its variables are declared once, in job db, and reused by anchor.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the pushed commits

      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Guards
        run: pnpm guards

      - name: db/source matches its manifest (D4.11)
        run: node db/scripts/check-source.mjs --manifest-only

      - name: Secret scan (gitleaks, pushed commits — CG-SEC-05)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          v="$GITLEAKS_VERSION"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" checksums.txt | awk '{print $1"  gitleaks.tar.gz"}' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range=""
          fi
          if [ -n "$range" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
          fi

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Prisma client (the API unit tests import it — gitignored, generated)
        run: pnpm --filter api generate

      - name: Unit tests (Vitest — incl. guard, lint-rule and runner tests)
        run: pnpm test

  db:
    name: db
    runs-on: ubuntu-24.04
    services: &postgres-service
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: point
          POSTGRES_PASSWORD: point_ci
          POSTGRES_DB: point
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U point"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env: &postgres-env
      PGHOST: localhost
      PGPORT: 5432
      PGPASSWORD: point_ci
      POSTGRES_USER: point
      POSTGRES_DB: point
      POINT_APP_DB_PASSWORD: app_ci
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Connection strings (owner for migrations, point_app for the API — D4.4)
        run: |
          echo "MIGRATE_DATABASE_URL=postgresql://point:${PGPASSWORD}@localhost:5432/point" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://point_app:${POINT_APP_DB_PASSWORD}@localhost:5432/point" >> "$GITHUB_ENV"

      - name: psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Role point_app (db/bootstrap/00-roles.sh)
        run: sh db/bootstrap/00-roles.sh

      - name: Migrate (the one entry point — D4.6)
        run: node db/scripts/migrate.mjs

      - name: Baseline, role and audit checks
        run: node db/scripts/check-baseline.mjs

      - name: Committed schema = the database (D4.5)
        run: pnpm db:check-introspection

      - name: Constraint tests (each file on its own migrated database — D4.9)
        run: pnpm db:test

  integration:
    name: integration
    runs-on: ubuntu-24.04
    # PostgreSQL as in job `db`, plus Mailpit: the mail tests deliver over SMTP and read the message
    # back through Mailpit's API (add-foundation-auth-access task 2.10 · ADR-007).
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: point
          POSTGRES_PASSWORD: point_ci
          POSTGRES_DB: point
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U point"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGPASSWORD: point_ci
      POSTGRES_USER: point
      POSTGRES_DB: point
      POINT_APP_DB_PASSWORD: app_ci
      SMTP_HOST: localhost
      MAIL_TRANSPORT: mailpit
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Connection strings (owner for migrations, point_app for the API — D4.4)
        run: |
          echo "MIGRATE_DATABASE_URL=postgresql://point:${PGPASSWORD}@localhost:5432/point" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://point_app:${POINT_APP_DB_PASSWORD}@localhost:5432/point" >> "$GITHUB_ENV"

      - name: psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Role point_app (db/bootstrap/00-roles.sh)
        run: sh db/bootstrap/00-roles.sh

      - name: Migrate (the one entry point — D4.6)
        run: node db/scripts/migrate.mjs

      - name: API integration tests (real app, real PostgreSQL 16, connected as point_app — D15)
        run: pnpm test:int

  images:
    name: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build api, web and backup with the commit as APP_VERSION (no push — D15)
        run: |
          set -euo pipefail
          v="${GITHUB_SHA::12}"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          docker build -f apps/api/Dockerfile --build-arg APP_VERSION="$v" -t "point-api:$v" .
          docker build -f apps/web/Dockerfile --build-arg APP_VERSION="$v" -t "point-web:$v" .
          docker build --build-arg APP_VERSION="$v" -t "point-backup:$v" infra/backup

      - name: Every image reports the commit, never 0.0.0-dev (D9)
        run: |
          set -euo pipefail
          for image in api web backup; do
            got=$(docker run --rm --entrypoint printenv "point-$image:$APP_VERSION" APP_VERSION)
            echo "point-$image reports $got"
            if [ "$got" = "0.0.0-dev" ] || [ "$got" != "$APP_VERSION" ]; then
              echo "::error::point-$image reports APP_VERSION=$got, expected $APP_VERSION"
              exit 1
            fi
          done

      - name: The api image holds no test file and no environment file (D13)
        run: |
          set -euo pipefail
          found=$(docker run --rm --entrypoint sh "point-api:$APP_VERSION" -c \
            'find / -xdev \( -path "/app/test*" -o -name ".env" -o -name ".env.*" -o -name "*.int.test.*" \) -print 2>/dev/null' || true)
          if [ -n "$found" ]; then echo "::error::unexpected files in the api image:"; echo "$found"; exit 1; fi

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v7

      - name: Hosts-file lines for the local origins (D12)
        run: echo "127.0.0.1 point.test app.point.test postgres" | sudo tee -a /etc/hosts

      - name: .env from .env.example, with generated internal keys and sign-in secrets
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^INTERNAL_SSR_KEY=.*|INTERNAL_SSR_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^INTERNAL_OPS_KEY=.*|INTERNAL_OPS_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^OTP_HMAC_SECRET=.*|OTP_HMAC_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^AUDIT_HASH_SECRET=.*|AUDIT_HASH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^MAIL_PAYLOAD_KEY=.*|MAIL_PAYLOAD_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^APP_VERSION=.*|APP_VERSION=${GITHUB_SHA::12}|" .env

      - name: Build its own images (independent of job images — D15)
        run: $COMPOSE build

      - name: Stack up with the dev override
        run: $COMPOSE up -d

      - name: Migrate (the one entry point — D4.6)
        run: $COMPOSE run --rm migrate

      - name: Wait for health ok through the staff host
        run: |
          for i in $(seq 1 60); do
            body=$(curl -sk --max-time 5 https://app.point.test/api/v1/health || true)
            if echo "$body" | grep -q '"status":"ok"'; then echo "$body"; exit 0; fi
            sleep 2
          done
          echo "::error::health never answered ok (last body: ${body:-none})"
          exit 1

      - uses: ./.github/actions/setup

      - name: Chromium for Playwright (the only browser — task 8.1)
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Playwright — smoke.spec.ts and edge.spec.ts against the stack (D15 · D18)
        env:
          E2E_COMPOSE: ${{ env.COMPOSE }}
        run: pnpm e2e

      # Spec "The web container never holds INTERNAL_OPS_KEY" (API-SHAPE-02 · task 8.6).
      - name: Secret distribution — each internal key only in its two holders
        # Independent of Playwright's result: one run reports both (PR #9 review).
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          expect() { # service variable present|absent
            # Actions runs this with `bash -e`; printenv exiting 1 is an expected answer here, so its
            # exit code is captured instead of ending the step.
            code=0
            out=$($COMPOSE exec -T "$1" printenv "$2") || code=$?
            if [ "$3" = present ] && [ "$code" -eq 0 ] && [ -n "$out" ]; then echo "ok    $1 holds $2"
            elif [ "$3" = absent ] && [ "$code" -eq 1 ] && [ -z "$out" ]; then echo "ok    $1 has no $2"
            else echo "::error::$1 $2: expected $3, printenv exited $code"; failed=1; fi
          }
          expect web    INTERNAL_OPS_KEY absent
          expect api    INTERNAL_OPS_KEY present
          expect backup INTERNAL_OPS_KEY present
          expect api    INTERNAL_SSR_KEY present
          expect web    INTERNAL_SSR_KEY present
          expect backup INTERNAL_SSR_KEY absent
          exit $failed

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --timestamps > compose-logs.txt

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Title and branch reach the scripts only through the environment, never the shell text.
      - name: PR title is a Conventional Commit with the change id (CG-GIT-02)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node tools/guards/check-pr-title.mjs

      - name: Branch name (CG-GIT-01)
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: node tools/guards/check-branch-name.mjs
