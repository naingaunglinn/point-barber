packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
  - 'e2e'
allowBuilds:
  # next-intl's message extractor (dev tooling, not used here): prebuilt binaries, no install script.
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  prisma: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - turbo@2.11.7
  - eslint-plugin-n@18.4.1
overrides:
  # eslint-plugin-jsx-a11y asks for axe-core ^4.10.0; 4.14.0 was published 05/Oct/2026 17:43 UTC, under the
  # 7 days of CG-DEP-05 on 12/Oct. 4.13.0 is also the version @axe-core/playwright 4.13.0 uses.
  axe-core: 4.13.0
